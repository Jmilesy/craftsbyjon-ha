- id: '1771001543004'
  alias: weather with 4-tier UK backup services
  description: Weather announcement with 4-tier UK backup services
  triggers:
  - trigger: time
    at: 07:20:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  conditions:
  - condition: state
    entity_id: input_boolean.school_day
    state: 'on'
  - condition: template
    value_template: '{% set school_text = (states(''input_text.boys_school'') ~ '' '' ~ (state_attr(''calendar.jacob_timetable'', ''message'') | default('''', true)) ~ '' '' ~ (state_attr(''calendar.joseph_timetable'', ''message'') | default('''', true))) | lower %} {{ ''holiday'' not in school_text and ''half term'' not in school_text and ''half-term'' not in school_text and ''inset'' not in school_text and ''bank'' not in school_text }}'
  actions:
  - action: weather.get_forecasts
    metadata: {}
    target:
      entity_id: "{% if has_value('weather.met_office_deal') %}\n  weather.met_office_deal\n{% elif has_value('weather.home_weather') %}\n  weather.home_weather\n{% elif has_value('weather.forecast_home') %}\n  weather.forecast_home\n{% else %}\n  weather.pirateweather\n{% endif %}\n"
    data:
      type: daily
    response_variable: daily_forecast
  - action: conversation.process
    metadata: {}
    data:
      text: 'You are an advanced smart home with a built in personal weather station. Weather updates will be spoken out loud and should be funny and creative because two children 11 years old and 14 years old will be listening. Please use whole numbers and try to make it educational! This should be less than 30 seconds in length. it is important that the school update comes first {% if states(''sensor.school_event_today'') %} School Update: {{ states(''sensor.school_event_today'') }} {% endif %} Current Conditions: Current time is {{ now().strftime(''%I:%M %p'') }}. Temperature is {% if has_value(''sensor.met_office_deal_temperature'') %}{{ states(''sensor.met_office_deal_temperature'') | round(0) }}°C{% elif has_value(''weather.home_weather'') %}{{ state_attr(''weather.home_weather'', ''temperature'') | round(0) }}°C{% elif has_value(''weather.forecast_home'') %}{{ state_attr(''weather.forecast_home'', ''temperature'') | round(0) }}°C{% else %}{{ states(''sensor.pirateweather_temperature'')
        | round(0) }}°C{% endif %}. Feels like {% if has_value(''sensor.pirateweather_apparent_temperature'') %}{{ states(''sensor.pirateweather_apparent_temperature'') | round(0) }}°C{% elif has_value(''weather.forecast_home'') %}{{ state_attr(''weather.forecast_home'', ''dew_point'') | round(0) }}°C{% else %}the same{% endif %}. Humidity is {% if has_value(''weather.pirateweather'') %}{{ state_attr(''weather.pirateweather'', ''humidity'') | round(0) }}%{% elif has_value(''weather.met_office_deal'') %}{{ state_attr(''weather.met_office_deal'', ''humidity'') | round(0) }}%{% elif has_value(''weather.home_weather'') %}{{ state_attr(''weather.home_weather'', ''humidity'') | round(0) }}%{% elif has_value(''weather.forecast_home'') %}{{ state_attr(''weather.forecast_home'', ''humidity'') | round(0) }}%{% endif %}. {% if has_value(''sensor.pirateweather_uv_index'') %}UV Index is {{ states(''sensor.pirateweather_uv_index'') | round(0) }}.{% elif has_value(''weather.forecast_home'') %}UV Index
        is {{ state_attr(''weather.forecast_home'', ''uv_index'') | round(1) }}.{% endif %} Current conditions: {% if has_value(''weather.met_office_deal'') %}{{ states(''weather.met_office_deal'') }}{% elif has_value(''weather.home_weather'') %}{{ states(''weather.home_weather'') }}{% elif has_value(''weather.forecast_home'') %}{{ states(''weather.forecast_home'') }}{% else %}{{ states(''weather.pirateweather'') }}{% endif %}. Today''s Forecast: {% if has_value(''sensor.pirateweather_hourly_summary'') %}Forecasted Conditions for Today {{ states(''sensor.pirateweather_hourly_summary'') }}{% endif %} {% set forecast_entity = ''weather.met_office_deal'' if has_value(''weather.met_office_deal'') else ''weather.home_weather'' if has_value(''weather.home_weather'') else ''weather.forecast_home'' if has_value(''weather.forecast_home'') else ''weather.pirateweather'' %} Temperature for Today {{ daily_forecast[forecast_entity].forecast[0].temperature }} Forecasted Low Temperature for Today {{ daily_forecast[forecast_entity].forecast[0].templow
        }} Forecasted Precipitation Probability {{ daily_forecast[forecast_entity].forecast[0].precipitation_probability }} {% set pollen_level = state_attr(''weather.silam_pollen_home_forecast'', ''next_condition'') %}{% set pollen_culprit = state_attr(''weather.silam_pollen_home_forecast'', ''responsible_elevated'') %}{% if pollen_level in [''medium'', ''high'', ''very_high''] %}Pollen Alert: {{ pollen_level }} levels today, mainly {{ pollen_culprit }}.{% endif %} '
      agent_id: conversation.kids_weather
    response_variable: agent
  - if:
    - condition: template
      value_template: '{% set speech = agent.response.speech.plain.speech | default('''', true) %}

        {% set lower_speech = speech | lower %}

        {{ speech | trim == '''' or ''problem getting a response'' in lower_speech or ''google generative ai'' in lower_speech or ''unavailable'' in lower_speech or ''503'' in lower_speech or ''error'' in lower_speech }}

        '
    then:
    - delay: 00:00:30
    - action: conversation.process
      metadata: {}
      data:
        text: 'Write a short, funny school-morning weather announcement for Jacob and Joseph. Keep it under 30 seconds. School update first: {{ states(''sensor.school_event_today'') }}. Current weather is {{ states(''weather.met_office_deal'') if has_value(''weather.met_office_deal'') else states(''weather.home_weather'') if has_value(''weather.home_weather'') else states(''weather.forecast_home'') if has_value(''weather.forecast_home'') else states(''weather.pirateweather'') }}. Temperature is {{ states(''sensor.met_office_deal_temperature'') if has_value(''sensor.met_office_deal_temperature'') else state_attr(''weather.home_weather'', ''temperature'') if has_value(''weather.home_weather'') else state_attr(''weather.forecast_home'', ''temperature'') if has_value(''weather.forecast_home'') else states(''sensor.pirateweather_temperature'') }} degrees C. Mention coats, rain, or sun if useful.'
        agent_id: conversation.kids_weather
      response_variable: agent
  - variables:
      kids_weather_message: "{% set speech = agent.response.speech.plain.speech | default('', true) %}\n{% set lower_speech = speech | lower %}\n{% if speech | trim == '' or 'problem getting a response' in lower_speech or 'google generative ai' in lower_speech or 'unavailable' in lower_speech or '503' in lower_speech or 'error' in lower_speech %}\n  Morning team. The fancy weather robot is having a lie-in, so here is the practical version: check the sky, grab your school bags, and take a coat if it looks even slightly suspicious outside.\n{% else %}\n  {{ speech }}\n{% endif %}\n"
  - action: notify.alexa_media
    data:
      message: '{{ kids_weather_message }}'
      data:
        type: announce
        method: all
        volume_level: 0.5
      target:
      - media_player.lounge_plus
      - media_player.boy_s_new_dot
      - media_player.bedroom_dot
      - media_player.kitchen_dot
  - action: notify.mobile_app_jon_phone
    metadata: {}
    data:
      message: '{{ kids_weather_message }}'
  mode: single
- id: family_school_evening_prep
  alias: Family school evening prep
  description: Evening school prep with AI announcement, PE detection, YouTube block, and actionable notifications for whichever boy(s) have school tomorrow (merged 14 Sep 2026 from separate Jacob/Joseph automations, which both fired at 19:00 and duplicated everything now both boys are at Goodwin)
  triggers:
  - trigger: time
    at: '19:00:00'
  conditions:
  - condition: time
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
  actions:
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.jacob_timetable
      - calendar.joseph_timetable
    data:
      start_date_time: '{{ (now().date() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 00:00:00'
      end_date_time: '{{ (now().date() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 23:59:59'
    response_variable: tomorrow_school_events
  - variables:
      jacob_has_school: '{{ (now().date() + timedelta(days=1)).weekday() < 5 and (tomorrow_school_events[''calendar.jacob_timetable''][''events'']) | selectattr(''summary'', ''search'', ''holiday|half\s*-?\s*term|inset|bank'', ignorecase=True) | list | count == 0 }}'
      joseph_has_school: '{{ (now().date() + timedelta(days=1)).weekday() < 5 and (tomorrow_school_events[''calendar.joseph_timetable''][''events'']) | selectattr(''summary'', ''search'', ''holiday|half\s*-?\s*term|inset|bank'', ignorecase=True) | list | count == 0 }}'
  - if:
    - condition: template
      value_template: '{{ not jacob_has_school and not joseph_has_school }}'
    then:
    - stop: Tomorrow is not a school day for either boy
  - if:
    - condition: template
      value_template: '{{ jacob_has_school }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.jacob_drink_confirmed
        - input_boolean.jacob_pe_kit_confirmed
        - input_boolean.jacob_pe_tomorrow
  - if:
    - condition: template
      value_template: '{{ joseph_has_school }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id:
        - input_boolean.joseph_drink_confirmed
        - input_boolean.joseph_pe_kit_confirmed
        - input_boolean.joseph_pe_tomorrow
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.kit_check_active
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.boys_school
      - calendar.jacob_timetable
      - calendar.joseph_timetable
    data:
      start_date_time: '{{ (now().date() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 00:00:00'
      end_date_time: '{{ (now().date() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 23:59:59'
    response_variable: school_events
  - if:
    - condition: template
      value_template: '{{ jacob_has_school and (school_events[''calendar.boys_school''][''events''] + school_events[''calendar.jacob_timetable''][''events'']) | selectattr(''summary'', ''search'', ''PE'', ignorecase=True) | list | count > 0 }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.jacob_pe_tomorrow
  - if:
    - condition: template
      value_template: '{{ joseph_has_school and (school_events[''calendar.boys_school''][''events''] + school_events[''calendar.joseph_timetable''][''events'']) | selectattr(''summary'', ''search'', ''PE'', ignorecase=True) | list | count > 0 }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.joseph_pe_tomorrow
  - variables:
      shared_school_event_text: '{% set evts = school_events[''calendar.boys_school''][''events''] %} {{ evts | map(attribute=''summary'') | join(''; '') }}'
  - action: conversation.process
    data:
      agent_id: conversation.evening_prep
      text: >-
        Write a short evening school prep announcement.
        {% if jacob_has_school and joseph_has_school %}School is tomorrow for both Jacob and Joseph. They need bags packed, homework done. Jacob needs a drink bottle in the fridge.
        {% elif jacob_has_school %}School is tomorrow for Jacob only (Joseph is off). Jacob needs his bag packed, homework done, and a drink bottle in the fridge.
        {% elif joseph_has_school %}School is tomorrow for Joseph only (Jacob is off). Joseph needs his bag packed, homework done, and a drink bottle in the fridge.
        {% endif %}
        {% if is_state('input_boolean.jacob_pe_tomorrow', 'on') %} Jacob also has PE tomorrow and needs his PE kit ready.{% endif %}
        {% if is_state('input_boolean.joseph_pe_tomorrow', 'on') %} Joseph also has PE tomorrow and needs his PE kit ready.{% endif %}
        {% if shared_school_event_text | trim != '' %} Also: {{ shared_school_event_text }}.{% endif %}
        At the end, add one short sentence warning that a YouTube block is coming soon for anyone who doesn't confirm their kit is sorted. Style: chaotic dad humour, dry sarcasm, short punchy sentences. No emojis. No baby talk. Address whichever boy(s) have school directly by name.
    response_variable: agent_response
  - if:
    - condition: template
      value_template: '{% set speech = agent_response.response.speech.plain.speech | default('''', true) %}{% set lower_speech = speech | lower %}{{ speech | trim == '''' or ''problem getting a response'' in lower_speech or ''google generative ai'' in lower_speech or ''unavailable'' in lower_speech or ''503'' in lower_speech or ''error'' in lower_speech }}'
    then:
    - delay: 00:00:30
    - action: conversation.process
      data:
        agent_id: conversation.evening_prep
        text: >-
          Try again. Write a short evening school prep announcement.
          {% if jacob_has_school and joseph_has_school %}School is tomorrow for both Jacob and Joseph. Bags packed, homework done, Jacob drink bottle in the fridge.
          {% elif jacob_has_school %}School is tomorrow for Jacob only. Jacob's bag packed, homework done, drink bottle in the fridge.
          {% elif joseph_has_school %}School is tomorrow for Joseph only. Joseph's bag packed, homework done, drink bottle in the fridge.
          {% endif %}
          {% if is_state('input_boolean.jacob_pe_tomorrow', 'on') %} Jacob has PE tomorrow and needs his kit ready.{% endif %}
          {% if is_state('input_boolean.joseph_pe_tomorrow', 'on') %} Joseph has PE tomorrow and needs his kit ready.{% endif %}
          End with a warning that a YouTube block is coming soon for anyone not sorted. Style: chaotic dad humour, dry sarcasm, short punchy sentences. No emojis.
      response_variable: agent_response
  - variables:
      evening_prep_message: '{% set speech = agent_response.response.speech.plain.speech | default('''', true) %}{% set lower_speech = speech | lower %}{% if speech | trim == '''' or ''problem getting a response'' in lower_speech or ''google generative ai'' in lower_speech or ''unavailable'' in lower_speech or ''503'' in lower_speech or ''error'' in lower_speech %}Evening school prep. Bags packed, homework checked, uniforms found, and drink bottles in the fridge. Sort it out — YouTube block incoming for anyone who doesn''t.{% else %}{{ speech }}{% endif %}'
  - action: notify.alexa_media
    data:
      message: '{{ evening_prep_message }}'
      target:
      - media_player.lounge_plus
      - media_player.boy_s_new_dot
      - media_player.bedroom_dot
      - media_player.kitchen_dot
      data:
        type: announce
        volume: 0.5
        method: all
  - if:
    - condition: state
      entity_id: input_boolean.youtube_block_enabled
      state: 'on'
    then:
    - action: shell_command.youtube_block_kids
      response_variable: block_result
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kit_check_active
  - if:
    - condition: template
      value_template: '{{ jacob_has_school }}'
    then:
    - action: notify.jacob_notify
      data:
        title: School Prep
        message: '{{ evening_prep_message }}'
    - action: notify.jacob_notify
      data:
        title: Drink bottles
        message: Jacob. How many drink bottles have you got in the fridge for tomorrow?
        data:
          actions:
          - action: JACOB_DRINK_ONE
            title: 1 bottle
          - action: JACOB_DRINK_TWO
            title: 2 bottles
          - action: JACOB_DRINK_NONE
            title: None yet
    - if:
      - condition: state
        entity_id: input_boolean.jacob_pe_tomorrow
        state: 'on'
      then:
      - action: notify.jacob_notify
        data:
          title: PE kit
          message: Jacob. PE tomorrow. Is your kit sorted?
          data:
            actions:
            - action: JACOB_PE_DONE
              title: Yes sorted
            - action: JACOB_PE_NOT_YET
              title: Not yet
  - if:
    - condition: template
      value_template: '{{ joseph_has_school }}'
    then:
    - action: notify.joseph_notify
      data:
        title: School Prep
        message: '{{ evening_prep_message }}'
    - action: notify.joseph_notify
      data:
        title: Drink bottles
        message: Joseph. How many drink bottles have you got in the fridge for tomorrow?
        data:
          actions:
          - action: JOSEPH_DRINK_ONE
            title: 1 bottle
          - action: JOSEPH_DRINK_TWO
            title: 2 bottles
          - action: JOSEPH_DRINK_NONE
            title: None yet
    - if:
      - condition: state
        entity_id: input_boolean.joseph_pe_tomorrow
        state: 'on'
      then:
      - action: notify.joseph_notify
        data:
          title: PE kit
          message: Joseph. PE tomorrow. Is your kit sorted?
          data:
            actions:
            - action: JOSEPH_PE_DONE
              title: Yes sorted
            - action: JOSEPH_PE_NOT_YET
              title: Not yet
  - if:
    - condition: state
      entity_id: input_boolean.youtube_block_enabled
      state: 'on'
    then:
    - action: notify.mobile_app_jon_phone
      data:
        title: 🎒 Kit Check Active
        message: YouTube, TikTok & Facebook blocked. Tap to unblock once kit is confirmed.
        data:
          actions:
          - action: KIT_CHECK_DONE
            title: ✅ All sorted — unblock
    - action: notify.mobile_app_sm_a566b
      data:
        title: 🎒 Kit Check Active
        message: YouTube, TikTok & Facebook blocked. Tap to unblock once kit is confirmed.
        data:
          actions:
          - action: KIT_CHECK_DONE
            title: ✅ All sorted — unblock
    - action: rest_command.home_api_notify
      data:
        title: 🎒 Kit Check Active
        body: YouTube, TikTok & Facebook blocked. Tap to unblock once the boys' kit is sorted.
        data: '{"action": "KIT_CHECK_DONE"}'
  mode: single
