# Reads calendar.boys_school, which the n8n flow Secretary - Blueyonder Monitor fills from Goodwin emails.
# Was hardcoded to "No school events tomorrow." from 11 Sep 2026 until 15 Oct 2026. This one covers tomorrow.
- triggers:
    - trigger: time_pattern
      minutes: "/10"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    - trigger: state
      entity_id: calendar.boys_school
  actions:
    - action: calendar.get_events
      target:
        entity_id: calendar.boys_school
      data:
        start_date_time: '{{ today_at("00:00") + timedelta(days=1) }}'
        end_date_time: '{{ today_at("00:00") + timedelta(days=2) }}'
      response_variable: school_events
  sensor:
    - name: school_event_tomorrow
      unique_id: school_event_tomorrow
      state: >
        {% set evs = school_events["calendar.boys_school"].events if school_events is defined else [] %}
        {% set ns = namespace(parts=[]) %}
        {% for e in evs %}
        {% if "T" in e.start %}
        {% set ns.parts = ns.parts + [e.summary ~ " (" ~ (as_datetime(e.start) | as_local).strftime("%H:%M") ~ " to " ~ (as_datetime(e.end) | as_local).strftime("%H:%M") ~ ")"] %}
        {% else %}
        {% set ns.parts = ns.parts + [e.summary ~ " (all day)"] %}
        {% endif %}
        {% endfor %}
        {{ (ns.parts | join("; "))[:250] if ns.parts else "No school events tomorrow." }}
