- id: bin_day_reminder
  alias: Bin Day Reminder
  description: Remind to put bins out for collection, aware of which bin types are actually due
  triggers:
  - at: '20:00:00'
    trigger: time
  conditions:
  - condition: time
    weekday:
    - thu
  - condition: template
    value_template: '{{ active_bins | length > 0 }}'
  variables:
    bin_colours:
      refuse:
      - 64
      - 64
      - 64
      recycling:
      - 0
      - 102
      - 204
      food:
      - 34
      - 139
      - 34
      papercard:
      - 230
      - 190
      - 40
    bin_friendly_names:
      refuse: black bin
      recycling: recycling
      food: food caddy
      papercard: paper and card
    active_bins: '{{ [''refuse'' if is_state(''sensor.waste_has_refuse'', ''True'') else None, ''recycling'' if is_state(''sensor.waste_has_recycling'', ''True'') else None, ''food'' if is_state(''sensor.waste_has_food'', ''True'') else None, ''papercard'' if is_state(''sensor.waste_has_papercard'', ''True'') else None] | select(''string'') | list }}'
    bin_summary: '{{ active_bins | map(''regex_replace'', ''^(.*)$'', '''') | list }}'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alert_active
  - repeat:
      for_each: '{{ active_bins }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.3dicons_rubbishbin
        data:
          rgb_color: '{{ bin_colours[repeat.item] }}'
      - delay: 00:00:03
  - if:
    - condition: template
      value_template: '{{ ''refuse'' in active_bins }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.bins_flash
  - if:
    - condition: template
      value_template: '{{ ''recycling'' in active_bins }}'
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.recycling_flash
  - action: notify.alexa_media_lounge_plus
    data:
      message: '{{ ''Reminder: tomorrow\''s bin collection includes '' + (active_bins | map(''regex_replace'', ''^(refuse)$'', ''the black bin'') | map(''regex_replace'', ''^(recycling)$'', ''recycling'') | map(''regex_replace'', ''^(food)$'', ''the food caddy'') | map(''regex_replace'', ''^(papercard)$'', ''paper and card'') | join('', '')) + ''. Please put them out.'' }}'
      data:
        type: announce
  - action: notify.mobile_app_jon_phone
    data:
      title: 🗑️ Bin Day Tomorrow
      message: '{{ active_bins | map(''regex_replace'', ''^(refuse)$'', ''Black bin'') | map(''regex_replace'', ''^(recycling)$'', ''Recycling'') | map(''regex_replace'', ''^(food)$'', ''Food caddy'') | map(''regex_replace'', ''^(papercard)$'', ''Paper/card'') | join('', '') }} due tomorrow. Don''t forget to put them out!'
  mode: single
