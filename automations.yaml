  - condition: template
    value_template: '{{ trigger.event.data.action in [''left'', ''right'', ''press'', ''long_press''] }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''left'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_select.rotary_ui_state
            state: menu
          sequence:
          - action: script.rotary_ui_menu_previous
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.rotary_ui_state'') in [''page_school'', ''page_jacob''] }}'
          sequence:
          - action: script.rotary_ui_page_previous
        default:
        - condition: template
          value_template: '{{ not is_state(''input_select.rotary_ui_state'', ''front'') }}'
        - action: script.rotary_ui_touch
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''right'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_select.rotary_ui_state
            state: menu
          sequence:
          - action: script.rotary_ui_menu_next
        - conditions:
          - condition: template
            value_template: '{{ states(''input_select.rotary_ui_state'') in [''page_school'', ''page_jacob''] }}'
          sequence:
          - action: script.rotary_ui_page_next
        default:
        - condition: template
          value_template: '{{ not is_state(''input_select.rotary_ui_state'', ''front'') }}'
        - action: script.rotary_ui_touch
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''press'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_select.rotary_ui_state
            state: front
          sequence:
          - action: script.rotary_ui_open_menu
        - conditions:
          - condition: state
            entity_id: input_select.rotary_ui_state
            state: menu
          sequence:
          - action: script.rotary_ui_open_selected_page
        default:
        - action: script.rotary_ui_page_press
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''long_press'' }}'
      sequence:
      - action: script.rotary_ui_return_front
