- id: boys_morning_sunrise
  alias: Boys Morning - Sunrise Light
  description: Gradual red to white transition 15 mins before Boy's Dot alarm on school days
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: template
    value_template: "{% set alarm = states('sensor.boy_s_new_dot_next_alarm') %} {% if alarm not in ['unknown', 'unavailable'] %}\n  {% set alarm_dt = alarm | as_datetime | as_local %}\n  {% set sunrise_dt = alarm_dt - timedelta(minutes=15) %}\n  {{ now().strftime('%H:%M') == sunrise_dt.strftime('%H:%M') }}\n{% else %}\n  false\n{% endif %}\n"
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - condition: state
    entity_id: input_boolean.school_day
    state: 'on'
  - condition: state
    entity_id: input_boolean.boys_bedtime
    state: 'on'
  actions:
  - repeat:
      count: 60
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.boys_light
          - light.joseph_bedroom
        data:
          transition: 5
          rgb_color: "{% set progress = repeat.index / 60 %} {% if progress < 0.5 %}\n  {% set t = progress * 2 %}\n  {{ [255, (200 * t) | int, 0] }}\n{% else %}\n  {% set t = (progress - 0.5) * 2 %}\n  {{ [255, (200 + 55 * t) | int, (100 * t) | int] }}\n{% endif %}\n"
          brightness: '{{ (2.55 + (252.45 * (repeat.index / 60))) | int }} '
      - delay:
          seconds: 5
