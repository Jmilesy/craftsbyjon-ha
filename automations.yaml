- id: '1786382296000'
  alias: Front Door
  description: Strobe flash bins/recycling (3 flashes each side, 0.5s per side) and buzz when front door opens. Announce on lounge + bedroom Alexas if still open after the strobe sequence.
  triggers:
  - type: opened
    device_id: 3261477c3a8e34b6126520c831c795d6
    entity_id: binary_sensor.front_door_2
    domain: binary_sensor
    trigger: device
  conditions: []
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alert_active
  - action: rest_command.alarm_panel_alert
    data:
      level: yellow
      source: FRONT DOOR
      detail: OPEN
  - action: rest_command.school_panel_alert
    data:
      level: yellow
      source: FRONT DOOR
      detail: OPEN
  - action: switch.turn_on
    target:
      entity_id: switch.mon_buzzer
  - delay:
      milliseconds: 500
  - action: switch.turn_off
    target:
      entity_id: switch.mon_buzzer
  - alias: Strobe wigwag while door is open
    repeat:
      while:
      - condition: state
        entity_id: binary_sensor.front_door_2
        state: 'on'
      - condition: template
        value_template: '{{ repeat.index <= 15 }}'
      sequence:
      - alias: 3 bins flashes totalling 0.5s
        repeat:
          count: 3
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.bins
          - delay:
              milliseconds: 83
          - action: switch.turn_off
            target:
              entity_id: switch.bins
          - delay:
              milliseconds: 84
      - alias: 3 recycling flashes totalling 0.5s
        repeat:
          count: 3
          sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.recycling
          - delay:
              milliseconds: 83
          - action: switch.turn_off
            target:
              entity_id: switch.recycling
          - delay:
              milliseconds: 84
  - action: switch.turn_off
    target:
      entity_id:
      - switch.bins
      - switch.recycling
  - condition: state
    entity_id: binary_sensor.front_door_2
    state: 'on'
  - action: rest_command.alarm_panel_alert
    data:
      level: red
      source: FRONT DOOR
      detail: OPEN
  - action: rest_command.school_panel_alert
    data:
      level: red
      source: FRONT DOOR
      detail: OPEN
  - action: notify.alexa_media_lounge_plus
    data:
      message: The Front door is open
  - action: notify.alexa_media_bedroom_dot
    data:
      message: The Front door is open
  mode: restart
