###############################################################
# ROOM CARD - WITH LIGHT-UP ICON & DYNAMIC BACKGROUND
###############################################################
room_card:
  show_icon: true
  show_name: true
  show_label: true
  
  styles:
    card:
      - padding: 14px
      - border-radius: 18px
      - border: 1px solid rgba(255,255,255,0.15)
      - box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.1)
      - backdrop-filter: blur(10px)
      - transition: all 0.35s ease
      - height: auto
      - background: |
          [[[
            const baseGradient = states['sensor.header_time_period'].attributes.gradient;
            const weatherOverlay = states['sensor.header_weather_summary'].attributes.weather_overlay;
            const sunTint = states['sensor.header_time_period'].attributes.sun_tint;
            const shimmer = "linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%)";
            
            const layers = [shimmer];
            if (sunTint !== 'none') layers.push(sunTint);
            if (weatherOverlay !== 'none') layers.push(weatherOverlay);
            layers.push(baseGradient);
            
            return layers.join(", ");
          ]]]
    
    grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 48px 1fr
      - grid-template-rows: auto auto
      - column-gap: 12px
      - row-gap: 4px
    
    img_cell:
      - justify-self: center
      - align-self: center
    
    icon:
      - width: 36px
      - height: 36px
      - color: |
          [[[
            return entity?.state === 'on' ? '#ffd700' : 'rgba(255,255,255,0.5)';
          ]]]
      - filter: |
          [[[
            return entity?.state === 'on'
              ? 'drop-shadow(0 0 8px #ffd700) drop-shadow(0 2px 8px rgba(0,0,0,0.5))' 
              : 'drop-shadow(0 2px 8px rgba(0,0,0,0.5))';
          ]]]
      - transition: all 0.3s ease
    
    name:
      - font-size: 1.05rem
      - font-weight: 600
      - color: white
      - text-shadow: 0 1px 4px rgba(0,0,0,0.5)
      - justify-self: start
      - align-self: end
    
    label:
      - font-size: 0.9rem
      - opacity: 0.85
      - color: rgba(255,255,255,0.9)
      - text-shadow: 0 1px 3px rgba(0,0,0,0.4)
      - justify-self: start
      - align-self: start

###############################################################
# SWITCH CARD - WITH DYNAMIC BACKGROUND
###############################################################
switch_card:
  show_icon: true
  show_name: true
  
  tap_action:
    action: toggle
  
  styles:
    card:
      - display: flex
      - flex-direction: column
      - align-items: center
      - justify-content: center
      - padding: 16px 12px
      - min-height: 90px
      - gap: 8px
      - border-radius: 16px
      - border: |
          [[[
            const glowColor = variables.glow_color || '#ffd700';
            return entity.state === 'on' ? `2px solid ${glowColor}60` : '1px solid rgba(255,255,255,0.15)';
          ]]]
      - box-shadow: |
          [[[
            const glowColor = variables.glow_color || '#ffd700';
            return entity.state === 'on' 
              ? `0 0 24px ${glowColor}40, 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.1)` 
              : '0 8px 32px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.1)';
          ]]]
      - backdrop-filter: blur(10px)
      - background: |
          [[[
            const glowColor = variables.glow_color || '#ffd700';
            const baseGradient = states['sensor.header_time_period'].attributes.gradient;
            const weatherOverlay = states['sensor.header_weather_summary'].attributes.weather_overlay;
            const sunTint = states['sensor.header_time_period'].attributes.sun_tint;
            const shimmer = "linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 100%)";
            
            const layers = [shimmer];
            if (sunTint !== 'none') layers.push(sunTint);
            if (weatherOverlay !== 'none') layers.push(weatherOverlay);
            
            if (entity.state === 'on') {
              layers.push(`linear-gradient(135deg, ${glowColor}25, ${glowColor}08)`);
            }
            
            layers.push(baseGradient);
            
            return layers.join(", ");
          ]]]
      - transition: all 0.35s ease
    
    icon:
      - width: 32px
      - height: 32px
      - color: |
          [[[
            const glowColor = variables.glow_color || '#ffd700';
            return entity.state === 'on' ? glowColor : 'rgba(255,255,255,0.6)';
          ]]]
      - filter: |
          [[[
            const glowColor = variables.glow_color || '#ffd700';
            return entity.state === 'on' 
              ? `drop-shadow(0 0 8px ${glowColor}80)` 
              : 'drop-shadow(0 2px 4px rgba(0,0,0,0.5))';
          ]]]
      - transition: all 0.3s ease
    
    name:
      - font-size: 0.9rem
      - font-weight: 500
      - color: white
      - text-shadow: 0 1px 3px rgba(0,0,0,0.5)
      - text-align: center

###############################################################
# ROOM STAT - Environment stat card for room views
# Usage: template: room_stat
# variables:
#   accent: RGB string e.g. "255,150,0" (default orange)
#   unit:   fallback unit if entity has none
###############################################################
room_stat:
  show_icon: false
  show_state: true
  show_units: false
  show_last_changed: false
  layout: vertical
  tap_action:
    action: more-info
  state_display: |
    [[[
      const s = entity?.state;
      const u = entity?.attributes?.unit_of_measurement || variables.unit || '';
      if (!s || s === 'unavailable' || s === 'unknown') return '—';
      const n = parseFloat(s);
      return isNaN(n) ? s : (n % 1 === 0 ? n : parseFloat(n.toFixed(1))) + u;
    ]]]
  styles:
    card:
      - background: |
          [[[
            const a = variables.accent || '255,150,0';
            const base = states['sensor.header_time_period']?.attributes?.gradient || 'linear-gradient(135deg,#1a1f3a,#2a2f4a)';
            const weather = states['sensor.header_weather_summary']?.attributes?.weather_overlay || 'none';
            const sun = states['sensor.header_time_period']?.attributes?.sun_tint || 'none';
            const layers = [
              `linear-gradient(135deg,rgba(${a},0.15),rgba(${a},0.06))`,
              'linear-gradient(135deg,rgba(255,255,255,0.04),rgba(255,255,255,0.08))'
            ];
            if (sun !== 'none') layers.push(sun);
            if (weather !== 'none') layers.push(weather);
            layers.push(base);
            return layers.join(',');
          ]]]
      - border-radius: 16px
      - border: |
          [[[return `1px solid rgba(${variables.accent||'255,150,0'},0.3)`;]]]
      - box-shadow: |
          [[[return `0 0 16px rgba(${variables.accent||'255,150,0'},0.15),0 4px 16px rgba(0,0,0,0.3)`;]]]
      - backdrop-filter: blur(10px)
      - padding: clamp(12px,2vh,20px) clamp(8px,1.5vw,16px)
    state:
      - color: |
          [[[return `rgb(${variables.accent||'255,150,0'})`;]]]
      - font-size: clamp(1.2rem,3vw,1.8rem)
      - font-weight: bold
    name:
      - font-size: clamp(0.6rem,1.2vw,0.75rem)
      - font-weight: "600"
      - letter-spacing: "0.08em"
      - opacity: "0.7"
      - text-transform: uppercase

###############################################################
# ROOM SECTION TITLE - Section header for room views
# Usage: template: room_section_title
# variables:
#   title:  label text e.g. "💡 LIGHTING"
#   accent: RGB string e.g. "255,200,0"
###############################################################
room_section_title:
  show_state: false
  show_icon: false
  tap_action:
    action: none
  name: |
    [[[ return variables.title || 'Section'; ]]]
  styles:
    card:
      - background: |
          [[[return `rgba(${variables.accent||'255,200,0'},0.08)`;]]]
      - border-radius: 10px
      - border: |
          [[[return `1px solid rgba(${variables.accent||'255,200,0'},0.2)`;]]]
      - border-left: |
          [[[return `3px solid rgba(${variables.accent||'255,200,0'},0.7)`;]]]
      - backdrop-filter: blur(8px)
      - padding: 10px 16px
      - margin-top: 8px
      - margin-bottom: 2px
    name:
      - font-size: "0.8rem"
      - font-weight: "700"
      - letter-spacing: "0.1em"
      - text-transform: uppercase
      - color: |
          [[[return `rgb(${variables.accent||'255,200,0'})`;]]]
      - text-align: left
