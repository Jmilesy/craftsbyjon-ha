# ============================================================
# Dover DDC waste - raw API data (for missed collection detection)
# Added 29 Aug 2026 alongside the dover_gov_uk source fix
# ============================================================
rest:
  - resource: https://portal.waste.dover.gov.uk/api/getCollectionDays
    method: POST
    headers:
      Content-Type: application/json
    payload: '{"pointId": "1481345", "pointType": "PointAddress", "councilId": "39"}'
    scan_interval: 21600
    sensor:
      - name: "Dover Waste Raw"
        unique_id: dover_waste_raw
        value_template: "{{ now().isoformat() }}"
        json_attributes_path: "$"
        json_attributes:
          - activeServices

  - resource: https://craftsbyjon.co.uk/api/ha-summary
    method: GET
    headers:
      X-HA-Key: !secret cbj_ha_summary_key
    scan_interval: 300
    timeout: 15
    sensor:
      - name: CBJ Orders Today
        unique_id: cbj_orders_today_count
        value_template: "{{ value_json.orders.today_count }}"
        icon: mdi:cart
      - name: CBJ Orders Today Revenue
        unique_id: cbj_orders_today_revenue
        value_template: "{{ (value_json.orders.today_revenue_pence / 100) | round(2) }}"
        unit_of_measurement: GBP
        icon: mdi:cash
      - name: CBJ Orders This Week
        unique_id: cbj_orders_week_count
        value_template: "{{ value_json.orders.week_count }}"
        icon: mdi:cart-outline
      - name: CBJ Orders This Week Revenue
        unique_id: cbj_orders_week_revenue
        value_template: "{{ (value_json.orders.week_revenue_pence / 100) | round(2) }}"
        unit_of_measurement: GBP
        icon: mdi:cash-multiple
      - name: CBJ Total Orders
        unique_id: cbj_orders_total
        value_template: "{{ value_json.orders.total }}"
        icon: mdi:receipt
      - name: CBJ Total Revenue
        unique_id: cbj_total_revenue
        value_template: "{{ (value_json.orders.total_revenue_pence / 100) | round(2) }}"
        unit_of_measurement: GBP
        icon: mdi:cash-100
      - name: CBJ Pending Dispatch
        unique_id: cbj_pending_dispatch
        value_template: "{{ value_json.orders.pending_dispatch_count }}"
        icon: mdi:truck-outline
      - name: CBJ Backorders
        unique_id: cbj_backorders
        value_template: "{{ value_json.orders.backorder_count }}"
        icon: mdi:alert-box-outline
      - name: CBJ Last Order
        unique_id: cbj_last_order_at
        value_template: "{{ value_json.orders.last_order_at }}"
        device_class: timestamp
        icon: mdi:clock-outline
      - name: CBJ Low Stock Count
        unique_id: cbj_low_stock_count
        value_template: "{{ value_json.stock.low_stock_count }}"
        json_attributes_path: "$.stock"
        json_attributes:
          - low_stock_ids
          - out_of_stock_ids
        icon: mdi:package-variant-minus
      - name: CBJ Out Of Stock Count
        unique_id: cbj_out_of_stock_count
        value_template: "{{ value_json.stock.out_of_stock_count }}"
        icon: mdi:package-variant-remove
      - name: CBJ Live Products
        unique_id: cbj_live_products
        value_template: "{{ value_json.products.live_count }}"
        icon: mdi:store-check
      - name: CBJ Total Products
        unique_id: cbj_total_products
        value_template: "{{ value_json.products.total }}"
        icon: mdi:store
      - name: CBJ Open Tasks
        unique_id: cbj_open_tasks
        value_template: "{{ value_json.priorities.open_total }}"
        icon: mdi:format-list-checks
      - name: CBJ In Progress Tasks
        unique_id: cbj_in_progress_tasks
        value_template: "{{ value_json.priorities.in_progress }}"
        icon: mdi:progress-clock
      - name: CBJ Top Priority Task
        unique_id: cbj_top_task
        value_template: "{{ value_json.priorities.top_task_title | default('None', true) }}"
        json_attributes_path: "$.priorities"
        json_attributes:
          - top_task_area
        icon: mdi:star-outline
