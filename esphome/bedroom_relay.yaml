esphome:
  name: bedroom_relay

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Bedroom Relay Fallback Hotspot"
    password: !secret bedroom_relay_ota_password

captive_portal:

esp8266:
  board: esp01

logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret api_password

switch:
  - platform: gpio
    name: "Bedroom Christmas"
    pin: 2
