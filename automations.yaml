      jon_ok: '{{ not is_state(''person.jon'',''home'') or states(''sensor.jon_phone_battery_state'') in [''charging'', ''full''] }}'
      natalie_ok: '{{ not is_state(''person.natalie'',''home'') or states(''sensor.sm_a566b_battery_state'') in [''charging'', ''full''] }}'
  - if:
    - condition: template
      value_template: '{{ not jon_ok or not natalie_ok }}'
    then:
    - variables:
        names_not_charging: '{{ ([''Jon''] if not jon_ok else []) + ([''Natalie''] if not natalie_ok else []) }}'
    - action: notify.alexa_media_bedroom_dot
      data:
        message: '{{ names_not_charging | join('' and '') }}{{ '' is'' if names_not_charging | length == 1 else '' are'' }} phone not charging.'
        data:
          type: announce
    - action: notify.alexa_media_lounge_plus
      data:
        message: '{{ names_not_charging | join('' and '') }}{{ '' is'' if names_not_charging | length == 1 else '' are'' }} phone not charging.'
        data:
          type: announce
  mode: single
