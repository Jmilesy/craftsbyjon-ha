# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/kiosk-mode/kiosk-mode.js

lovelace:
  # resources: !include lovelace/resources/resources.yaml
  dashboards:
    cinematic-dashboard:
      mode: yaml
      title: Cinematic
      icon: mdi:movie-open
      show_in_sidebar: true
      filename: lovelace/cinematic-dashboard.yaml

    cinematic-v2:
      mode: yaml
      title: Cinematic V2
      icon: mdi:filmstrip
      show_in_sidebar: true
      filename: lovelace/cinematic-v2.yaml

    cbj-lcars:
      mode: yaml
      title: CBJ LCARS
      icon: mdi:rocket-launch
      show_in_sidebar: true
      filename: lovelace/cbj-lcars.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Template sensors (loads all YAML files in templates/ folder)
template: !include_dir_merge_list templates/

command_line:
  - sensor:
      name: Met Office Pollen London South East
      unique_id: met_office_pollen_london_south_east
      command: "python3 /config/scripts/met_office_pollen.py"
      scan_interval: 21600
      value_template: "{{ value_json.today_level }}"
      json_attributes:
        - region
        - summary
        - forecast_codes
        - forecast_levels
        - issued
        - source

homeassistant:
  allowlist_external_dirs:
    - "/media"
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - 10.0.0.0/24
        - 192.168.1.0/24
        - 100.64.0.0/10
      trusted_users:
        192.168.1.43: a663b3fdb7874445be8a4dfefaee08d9
        100.64.239.100: a663b3fdb7874445be8a4dfefaee08d9


  customize:
    sensor.bedroom_brightness:
      device_class: illuminance
    sensor.kitchen_brightness:
      device_class: illuminance
    sensor.landing_brightness:
      device_class: illuminance
    sensor.diningroom_temp:
      device_class: temperature

sensor:
  - platform: time_date
    display_options:
      - 'time'

# ============================================================
# Waste Collection Schedule – Source Configuration
# ============================================================
waste_collection_schedule:
  sources:
    - name: dover_gov_uk
      args:
        uprn: "10034882837"
        postcode: "CT14 7BG"
      customize:
        - type: REFUSE
          alias: "Refuse Collection"
          icon: mdi:trash-can-outline
        - type: FOOD
          alias: "Food Collection"
          icon: mdi:food
        - type: RECYCLING
          alias: "Recycling Collection"
          icon: mdi:recycle
        - type: PAPERCARD
          alias: "Paper/Card Collection"
          icon: mdi:package-variant
  sensors:
    - name: "Next Waste Collection"
      source_index: 0
      count: 3
      leadtime: 60
      add_days_to: true

notify:
  - platform: group
    name: jon_notify
    services:
      - service: mobile_app_jon_phone

  - platform: group
    name: jacob_notify
    services:
      - service: mobile_app_jacob_phone

  - platform: group
    name: joseph_notify
    services:
      - service: mobile_app_joseph_phone

  - platform: group
    name: natalie_notify
    services:
      - service: mobile_app_sm_a566b

mqtt:
  sensor:
    - name: "Alarm Panel Heartbeat"
      unique_id: alarm_panel_hbeatret
      state_topic: alarm/hbeatret
      expire_after: 120
      icon: mdi:shield-home

recorder:
  purge_keep_days: 30
  commit_interval: 30
  exclude:
    entities:
      # High-churn diagnostic/display helpers that do not need history.
      - sensor.jacob_phone_active_notification_count # This one was causing large attributes
      - sensor.header_current_time
      - sensor.boys_room_jacob_svg_x
      - sensor.boys_room_jacob_svg_y
      - sensor.boys_room_joseph_svg_x
      - sensor.boys_room_joseph_svg_y
      - sensor.boys_room_jacob_dot_style
      - sensor.boys_room_joseph_dot_style
      - sensor.system_monitor_load_1m
      - sensor.system_monitor_load_5m
      - sensor.system_monitor_load_15m
      - sensor.system_monitor_processor_use
      - sensor.system_monitor_memory_usage
      - sensor.system_monitor_processor_temperature
      # Continuous mmWave/radar telemetry (Alarm Panel V2 test bed) — updates
      # every 1-2 seconds, was the single biggest contributor to recorder DB growth
      # (7GB / 15.6M states rows after 30 days). Underperforming sensors, not
      # relied on for automations as of 2 Sep 2026 — excluded from history entirely.
      - sensor.boys_room_bed_radar_state
      - sensor.mmwave_test_bed_ld2410c_still_energy
      - sensor.time

