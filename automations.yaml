- id: school_day_manager
  alias: School Day Manager
  description: 'At midnight: get each boy''s own timetable events for today. Weekend, or an event containing holiday/half-term/inset/bank-holiday in HIS OWN calendar -> that boy''s school day OFF, otherwise ON. Each boy''s status is independent (fixed 2 Sep 2026 - previously combined, so one boy''s holiday event incorrectly cancelled the other boy''s school day too). input_boolean.school_day is kept as OR of the two, for shared/household automations (lights, joint announcements).'
  triggers:
  - trigger: time
    at: 00:01:00
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - calendar.jacob_timetable
    - calendar.joseph_timetable
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.jacob_timetable
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 00:00:00'
      end_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 23:59:59'
    response_variable: jacob_events
  - action: calendar.get_events
    target:
      entity_id: calendar.joseph_timetable
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 00:00:00'
      end_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 23:59:59'
    response_variable: joseph_events
  - if:
    - condition: template
      value_template: "{{ now().weekday() >= 5 or\n   jacob_events['calendar.jacob_timetable']['events'] |\n   selectattr('summary', 'search', 'holiday|half\\s*-?\\s*term|inset|bank\\s*holiday', ignorecase=True) |\n   list | count > 0 }}\n"
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.jacob_school_day
    else:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.jacob_school_day
  - if:
    - condition: template
      value_template: "{{ now().weekday() >= 5 or\n   joseph_events['calendar.joseph_timetable']['events'] |\n   selectattr('summary', 'search', 'holiday|half\\s*-?\\s*term|inset|bank\\s*holiday', ignorecase=True) |\n   list | count > 0 }}\n"
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.joseph_school_day
    else:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.joseph_school_day
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: input_boolean.jacob_school_day
        state: 'on'
      - condition: state
        entity_id: input_boolean.joseph_school_day
        state: 'on'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.school_day
    else:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.school_day
  - if:
    - condition: template
      value_template: "{{ now().weekday() >= 5 or\n   (jacob_events['calendar.jacob_timetable']['events'] + joseph_events['calendar.joseph_timetable']['events']) |\n   selectattr('summary', 'search', 'holiday|half\\s*-?\\s*term|inset|bank\\s*holiday', ignorecase=True) |\n   list | count > 0 }}\n"
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.boys_school
      data:
        value: "{%- set off_event = (jacob_events['calendar.jacob_timetable']['events'] + joseph_events['calendar.joseph_timetable']['events']) |\n   selectattr('summary', 'search', 'holiday|half\\s*-?\\s*term|inset|bank\\s*holiday', ignorecase=True) |\n   map(attribute='summary') | first | default('') -%}\n{% if off_event %}{{ off_event }}{% else %}Enjoy your day off{% endif %}\n"
    else:
    - action: input_text.set_value
      target:
        entity_id: input_text.boys_school
      data:
        value: "{%- set events = (jacob_events['calendar.jacob_timetable']['events'] + joseph_events['calendar.joseph_timetable']['events']) |\n   map(attribute='summary') | list -%}\n{% if events %}{{ events | join(', ') }}{% else %}School day{% endif %}\n"
  mode: single
- id: boys_timetable_text
  alias: Boys Timetable Text
  description: Updates plain text timetable helpers for the school panel and rotary controller.
  mode: single
  triggers:
  - trigger: time
    at: 00:05:00
  - trigger: homeassistant
    event: start
  actions:
  - action: calendar.get_events
    target:
      entity_id: calendar.jacob_timetable
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 00:00:00'
      end_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 23:59:59'
    response_variable: jacob_today
  - action: calendar.get_events
    target:
      entity_id: calendar.jacob_timetable
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 00:00:00'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 23:59:59'
    response_variable: jacob_tomorrow
  - if:
    - condition: template
      value_template: '{{ states(''calendar.joseph_timetable'') not in [''unknown'', ''unavailable''] }}'
    then:
    - action: calendar.get_events
      target:
        entity_id: calendar.joseph_timetable
      data:
        start_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 00:00:00'
        end_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 23:59:59'
      response_variable: joseph_today
    - action: calendar.get_events
      target:
        entity_id: calendar.joseph_timetable
      data:
        start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 00:00:00'
        end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d'') }} 23:59:59'
      response_variable: joseph_tomorrow
    - action: input_text.set_value
      target:
        entity_id: input_text.joseph_timetable_today
      data:
        value: '{%- set events = joseph_today[''calendar.joseph_timetable''][''events''] | map(attribute=''summary'') | list -%}

          {%- if events -%}{{ events | join('', '') | truncate(255, true, '''') }}{%- else -%}No lessons today{%- endif -%}'
    - action: input_text.set_value
      target:
        entity_id: input_text.joseph_timetable_tomorrow
      data:
        value: '{%- set events = joseph_tomorrow[''calendar.joseph_timetable''][''events''] | map(attribute=''summary'') | list -%}

          {%- if events -%}{{ events | join('', '') | truncate(255, true, '''') }}{%- else -%}No lessons tomorrow{%- endif -%}'
    else:
    - action: input_text.set_value
      target:
        entity_id: input_text.joseph_timetable_today
      data:
        value: Joseph timetable calendar not configured
    - action: input_text.set_value
      target:
        entity_id: input_text.joseph_timetable_tomorrow
      data:
        value: Joseph timetable calendar not configured
  - action: input_text.set_value
    target:
      entity_id: input_text.jacob_timetable_today
    data:
      value: '{%- set events = jacob_today[''calendar.jacob_timetable''][''events''] | map(attribute=''summary'') | list -%}

        {%- if events -%}{{ events | join('', '') | truncate(255, true, '''') }}{%- else -%}No lessons today{%- endif -%}'
  - action: input_text.set_value
    target:
      entity_id: input_text.jacob_timetable_tomorrow
    data:
      value: '{%- set events = jacob_tomorrow[''calendar.jacob_timetable''][''events''] | map(attribute=''summary'') | list -%}

        {%- if events -%}{{ events | join('', '') | truncate(255, true, '''') }}{%- else -%}No lessons tomorrow{%- endif -%}'
