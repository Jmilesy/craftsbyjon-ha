- id: printer_paper_safe_sync_cups
  alias: Printer Paper Safe - Sync CUPS Queue
  description: Pauses/resumes the CanonTR4650 CUPS queue on the print-server Pi to match the paper-safety toggle. Jobs sent while paused are held by CUPS and print automatically once resumed.
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.printer_paper_safe
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.printer_paper_safe
        state: "on"
      sequence:
      - action: shell_command.printer_cups_enable
    - conditions:
      - condition: state
        entity_id: input_boolean.printer_paper_safe
        state: "off"
      sequence:
      - action: shell_command.printer_cups_disable

- id: printer_paper_safe_nudge
  alias: Printer Paper Safe - Left Off Nudge
  description: Notifies Jon if the paper-safety toggle has been left off (stickers loaded, print jobs held) for more than a day.
  mode: single
  triggers:
  - trigger: state
    entity_id: input_boolean.printer_paper_safe
    to: "off"
    for:
      hours: 24
  conditions: []
  actions:
  - action: notify.jon_notify
    data:
      title: Printer still paused
      message: The CBJ/Goodwin print queue has been held for over 24 hours because "Printer Paper Safe" is still off. Swap the paper back and flip the toggle if you're done with stickers.
- id: cbj_print_job_webhook
  alias: CBJ Print Job Webhook
  description: >-
    Receives a print request (from n8n, e.g. Goodwin email auto-print or
    CBJ dispatch notes) and dispatches it to the CanonTR4650 queue via
    CUPS. POST JSON body: {"type": "text"|"file", "content_b64": "...",
    "ext": "pdf"} — ext only used when type is "file", defaults to pdf.
  mode: queued
  max: 10
  triggers:
  - trigger: webhook
    webhook_id: cbj_print_job_8f2e91d4a7
    allowed_methods:
    - POST
    local_only: false
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.type == 'file' }}"
      sequence:
      - action: shell_command.printer_print_file
        data:
          content_b64: "{{ trigger.json.content_b64 }}"
          ext: "{{ trigger.json.ext | default('pdf') }}"
    default:
    - action: shell_command.printer_print_text
      data:
        content_b64: "{{ trigger.json.content_b64 }}"
