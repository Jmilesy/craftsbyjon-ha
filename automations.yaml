- id: adguard_per_user_filtering
  alias: AdGuard — Per-User Filtering (JonPC Console)
  description: 'Watches sensor.jon_pc_console_active_console_user and applies the appropriate AdGuard filtering policy to the Kids-VLAN based on who is logged into JonPC. jon_m=unfiltered, natal=default, all others=boys.

    '
  triggers:
  - trigger: state
    entity_id: sensor.jon_pc_console_active_console_user
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.jon_pc_console_active_console_user
        state: jon_m
      sequence:
      - action: shell_command.adguard_set_unfiltered_policy
      - action: notify.jon_notify
        data:
          message: '🔓 JonPC: Jon logged in — AdGuard Kids-VLAN unfiltered'
    - conditions:
      - condition: state
        entity_id: sensor.jon_pc_console_active_console_user
        state: natal
      sequence:
      - action: shell_command.adguard_set_default_policy
      - action: notify.jon_notify
        data:
          message: '🔒 JonPC: Natalie logged in — AdGuard Kids-VLAN default policy'
    - conditions:
      - condition: state
        entity_id: sensor.jon_pc_console_active_console_user
        state: miles
      sequence:
      - action: shell_command.adguard_set_boys_policy
      - action: notify.jon_notify
        data:
          message: '👦 JonPC: Joseph logged in — AdGuard Kids-VLAN boys policy'
    - conditions:
      - condition: state
        entity_id: sensor.jon_pc_console_active_console_user
        state: child
      sequence:
      - action: shell_command.adguard_set_boys_policy
      - action: notify.jon_notify
        data:
          message: '👦 JonPC: Jacob logged in — AdGuard Kids-VLAN boys policy'
    default:
    - action: shell_command.adguard_set_boys_policy
    - action: notify.jon_notify
      data:
        message: '🔒 JonPC: {{ states(''sensor.jon_pc_console_active_console_user'') | default(''unknown'') }} logged in — AdGuard Kids-VLAN boys policy (fail-safe)

          '
  mode: single
  max_exceeded: silent
- id: boys_phones_charging_2210
  alias: Check Boys Phones Charging 22:10
  description: Alexa announcement if Jacob's or Joseph's phone isn't charging at 22:10, skipping anyone not home (sleepovers etc)
  triggers:
  - trigger: time
    at: '22:10:00'
  conditions: []
  actions:
  - variables:
      jacob_ok: '{{ not is_state(''person.jacob'',''home'') or states(''sensor.jacob_phone_battery_state'') in [''charging'', ''full''] }}'
      joseph_ok: '{{ not is_state(''person.joseph'',''home'') or states(''sensor.joseph_phone_battery_state'') in [''charging'', ''full''] }}'
  - if:
    - condition: template
      value_template: '{{ not jacob_ok or not joseph_ok }}'
    then:
    - variables:
        names_not_charging: '{{ ([''Jacob''] if not jacob_ok else []) + ([''Joseph''] if not joseph_ok else []) }}'
    - data:
        message: '{{ names_not_charging | join('' and '') }}{{ '' is'' if names_not_charging | length == 1 else '' are'' }} phone not charging.'
        data:
          type: announce
      action: notify.alexa_media_bedroom_dot
    - data:
        message: '{{ names_not_charging | join('' and '') }}{{ '' is'' if names_not_charging | length == 1 else '' are'' }} phone not charging.'
        data:
          type: announce
      action: notify.alexa_media_lounge_plus
  mode: single
- id: adults_phone_charging_sleep_check
  alias: Check Jon/Natalie Phone Charging on Sleep Detection
  description: When sleep confidence stays above 75% for 20 minutes, check if that person's phone is charging. Skips anyone not home.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.jon_phone_sleep_confidence
    above: 75
    for:
      minutes: 20
    id: jon
  - trigger: numeric_state
    entity_id: sensor.sm_a566b_sleep_confidence
    above: 75
    for:
      minutes: 20
    id: natalie
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: jon
      - condition: state
        entity_id: person.jon
        state: home
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.jon_phone_battery_state
          state: charging
        - condition: state
          entity_id: sensor.jon_phone_battery_state
          state: full
      sequence:
      - action: notify.alexa_media_bedroom_dot
        data:
          message: Jon, your phone is not charging.
          data:
            type: announce
      - action: notify.alexa_media_lounge_plus
        data:
          message: Jon, your phone is not charging.
          data:
            type: announce
    - conditions:
      - condition: trigger
        id: natalie
      - condition: state
        entity_id: person.natalie
        state: home
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.sm_a566b_battery_state
          state: charging
        - condition: state
          entity_id: sensor.sm_a566b_battery_state
          state: full
      sequence:
      - action: notify.alexa_media_bedroom_dot
        data:
          message: Natalie, your phone is not charging.
          data:
            type: announce
      - action: notify.alexa_media_lounge_plus
        data:
          message: Natalie, your phone is not charging.
          data:
            type: announce
  mode: parallel
- id: adults_phone_charging_fallback_2330
  alias: Check Jon/Natalie Phone Charging 23:30 Fallback
  description: 'Safety net: at 23:30, checks Jon and Natalie''s phones regardless of sleep detection, in case the sleep-confidence trigger missed. Skips anyone not home.'
  triggers:
  - trigger: time
    at: '23:30:00'
  conditions: []
  actions:
