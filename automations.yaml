- id: octoprint_print_done
  alias: OctoPrint - Print Complete Announcement
  description: Announce on alarm Alexa when print finishes. Silent 8pm-7am.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.octoprint_printing
    from: 'on'
    to: 'off'
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state == ''on'' and trigger.to_state.state == ''off'' }}'
  - condition: state
    entity_id: binary_sensor.octoprint_printing_error
    state: 'off'
